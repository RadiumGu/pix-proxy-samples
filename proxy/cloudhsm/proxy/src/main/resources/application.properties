quarkus.banner.enabled=false

quarkus.log.level=INFO

# quarkus.camel.routes-discovery.enabled is deliberately NOT set.
#
# It used to be set to false, and that DISABLES THE WHOLE APPLICATION on camel-quarkus 2.x and later.
# Measured against a real HSM, the same jar rebuilt per variant:
#
#   =false  ->  Routes startup (total:0)   - no HSM login, no SslContext, nothing runs
#   =true   ->  logged in as pixcu, Routes startup (total:3)
#
# History, because the mechanism is counter-intuitive: the original key was
# quarkus.camel.main.routes-discovery.enabled, valid on camel-quarkus 1.x where discovery only meant
# scanning for RoutesBuilder CLASSES and CDI registered an @ApplicationScoped RouteBuilder regardless. On
# 2.x that key became UNRECOGNIZED, so it was ignored and the app kept working BECAUSE the setting no
# longer took effect. Correcting the key to its 2.x spelling made the value apply for the first time -
# and in 2.x+ discovery governs RoutesBuilder BEANS too, switching off the module's only route.
#
# Left unset so it defaults to enabled. This module has exactly one RouteBuilder and discovery is what is
# wanted; an explicit "=true" would only invite someone to flip it back.
#
# NOTE FOR ANY FUTURE A/B ON THIS: the property is BUILD-TIME. Passing -D at runtime changes nothing and
# produces total:0 either way, which looks like a clean result and tests nothing.
camel.context.name=pix-proxy-cloudhsm

# quarkus.package.JAR.type, not quarkus.package.type. Quarkus 3.x deprecated the old key:
#
#   'quarkus.package.type' has been deprecated and replaced by:
#     [quarkus.package.jar.enabled, quarkus.package.jar.type, quarkus.native.enabled, ...]
#
# It still WORKS on 3.33, which is why it is worth fixing now rather than after an upgrade turns a
# deprecated key into an ignored one - and an ignored packaging key silently produces a fast-jar
# directory instead of the *-runner.jar the Dockerfile copies. That exact failure happened on the
# 1.7 -> 2.13 leg with the previous spelling of this key.
#
# check-quarkus-config-keys.sh now fails the build on a DEPRECATED key as well as an unrecognized one.
# That gap was found by the gate itself: the first version only matched "Unrecognized", so this
# deprecation sailed past it.
quarkus.package.jar.type=uber-jar