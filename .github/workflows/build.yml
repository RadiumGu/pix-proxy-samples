name: build

# Upstream (aws-samples/pix-proxy-samples) has no CI at all - a third-party automation
# maturity analysis filed as upstream issue #13 flags "Run tests" as not implemented.
# This fork adds one so that anybody receiving this code can see, from the commit status
# alone, that it compiles and that the regression tests pass.

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: core - build + test (the signature logic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (v4.3.1)

      # JDK 11 on purpose: proxy/pom.xml sets java.version=11, and proxy/core/pom.xml
      # relies on --add-exports against two java.xml.crypto internal packages. Changing
      # the JDK major version here would not be testing what this project actually ships.
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4 (v4.7.1)
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Build and test proxy/core
        run: mvn -B -f proxy/pom.xml -pl core test

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 (v4.6.2)
        with:
          name: surefire-core
          path: proxy/core/target/surefire-reports/
          if-no-files-found: warn

  simulator:
    name: CloudHSM simulator - compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (v4.3.1)
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4 (v4.7.1)
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      # proxy/test is the maintained CloudHSM teaching simulator. KMS is deliberately
      # historical/unsupported in this fork and must not make the maintained path red.
      - name: Compile CloudHSM simulator (without unsupported KMS)
        run: mvn -B -f proxy/pom.xml -pl core,test package -DskipTests

  dict-v2-contract:
    name: DICT v2 transparent-proxy contract test
    runs-on: ubuntu-latest
    # Why a separate job: every other job here either skips tests (-DskipTests) or is
    # best-effort, so before this job existed NOTHING in CI executed the transparent-proxy
    # contract test. A test CI never runs is not a gate. This job runs it and nothing else,
    # so a contract regression is attributable at a glance.
    #
    # It needs no CloudHSM rpm, no HSM, no certificates and no AWS: the contract test drives
    # camel-netty-http over plain loopback HTTP. That also keeps it off the external
    # rpm download the cloudhsm job depends on, so this gate cannot go red for unrelated reasons.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (v4.3.1)
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4 (v4.7.1)
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Run DICT v2 contract + core tests
        run: mvn -B -f proxy/pom.xml -pl core,test test

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 (v4.6.2)
        with:
          name: surefire-dict-v2-contract
          path: |
            proxy/core/target/surefire-reports/
            proxy/test/target/surefire-reports/
          if-no-files-found: warn

  cloudhsm:
    name: cloudhsm - compile (production module GATES; SDK 3 rpm fetch is best effort)
    runs-on: ubuntu-latest
    # No job-level continue-on-error any more, and that is the point.
    #
    # It used to be non-blocking wholesale, because this job needs an SDK 3 rpm fetched from
    # a public S3 bucket at build time - an external dependency we do not control, and one
    # that WILL rot, since AWS disables download links for unsupported Client SDK versions
    # and SDK 3 is end-of-life. But making the whole job advisory also meant a genuine
    # compile break in proxy/cloudhsm/proxy - the production route, the TLS factory, the
    # processors - never failed the build. That module is the point of this repository.
    #
    # So the two concerns are separated instead of traded off. Fetching and installing the
    # SDK 3 jar stays best effort at STEP level. Compiling our own source GATES, and is
    # skipped rather than failed when the prerequisite could not be fetched - with a warning
    # so a skipped gate is never mistaken for a passed one.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (v4.3.1)
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4 (v4.7.1)
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
      - name: Install rpm tooling (required by rpm-maven-plugin)
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Fetch and install the SDK 3 JCE jar (external download - best effort)
        id: sdk3
        continue-on-error: true
        # The leading "." installs the aggregator pom com.amazon.aws:pix itself. Without it the
        # next step fails with "Could not find artifact com.amazon.aws:pix:pom:1.0.0", because
        # -pl cloudhsm/proxy resolves its parent from the local repository rather than from the
        # reactor. That is invisible on a developer machine whose ~/.m2 already holds the parent
        # from an earlier full build, and it is exactly what broke the first version of this job.
        run: mvn -B -f proxy/pom.xml -pl .,core,cloudhsm/cavium install -DskipTests
      - name: Compile proxy/cloudhsm/proxy - THIS GATES
        if: steps.sdk3.outcome == 'success'
        run: mvn -B -f proxy/pom.xml -pl cloudhsm/proxy package -DskipTests
      - name: Say plainly that the gate was skipped, not passed
        if: steps.sdk3.outcome != 'success'
        run: |
          echo "::warning::The SDK 3 JCE rpm could not be fetched, so the proxy/cloudhsm/proxy"
          echo "::warning::compile gate was SKIPPED - it did not pass. SDK 3 is end-of-life and"
          echo "::warning::its download links are withdrawn over time; see the pin in proxy/pom.xml."

  shell:
    name: wrapper_script.sh - shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (v4.3.1)
      - name: Syntax check
        run: |
          bash -n proxy/cloudhsm/proxy/src/main/docker/wrapper_script.sh
          bash -n .github/scripts/check-transport-contract.sh
      - name: ShellCheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck -S warning proxy/cloudhsm/proxy/src/main/docker/wrapper_script.sh
          shellcheck -S warning .github/scripts/check-transport-contract.sh

  transport-contract:
    name: transport contract - production route options + KMS scope guard
    runs-on: ubuntu-latest
    # The production CloudHSM route cannot be started in CI (it needs CloudHSM, an HSM login and
    # AWS), so its endpoint configuration is pinned by source assertion instead. This is the
    # companion to the dict-v2-contract job: that one characterises what the options DO, this one
    # keeps production declaring them. It also guards the CloudHSM-only scope by failing if KMS
    # re-enters the maintained workflow.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (v4.3.1)
      - name: Check transport contract options and scope
        run: bash .github/scripts/check-transport-contract.sh

  audit-schema:
    name: audit schema - AuditLog keys vs documented Glue columns
    runs-on: ubuntu-latest
    # Turns upstream issue #16 into a build failure instead of silent data loss:
    # any field AuditLog emits must be declared as a column in both READMEs.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (v4.3.1)
      - name: Compare emitted keys against documented columns
        run: |
          set -euo pipefail
          keys=$(grep -o 'put("[a-z_]*"' proxy/core/src/main/java/com/amazon/aws/pix/core/audit/AuditLog.java \
                 | sed 's/put("//; s/"//' | sort -u)
          echo "AuditLog emits:"; echo "$keys" | sed 's/^/  /'
          rc=0
          for readme in README-CloudHSM.md README-KMS.md; do
            for k in $keys; do
              if ! grep -q "name: '$k'" "$readme"; then
                echo "::error file=$readme::AuditLog emits '$k' but $readme declares no such Glue column - Firehose would drop it silently"
                rc=1
              fi
            done
          done
          [ "$rc" -eq 0 ] && echo "OK: every emitted field is declared in both READMEs"
          exit "$rc"
