name: build

# Upstream (aws-samples/pix-proxy-samples) has no CI at all - a third-party automation
# maturity analysis filed as upstream issue #13 flags "Run tests" as not implemented.
# This fork adds one so that anybody receiving this code can see, from the commit status
# alone, that it compiles and that the regression tests pass.

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: core - build + test (the signature logic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 - resolved from the SHA, not from the tag I typed

      # JDK 11 on purpose: proxy/pom.xml sets java.version=11, and proxy/core/pom.xml
      # relies on --add-exports against two java.xml.crypto internal packages. Changing
      # the JDK major version here would not be testing what this project actually ships.
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1 - resolved from the SHA, not from the tag I typed
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Build and test proxy/core
        run: mvn -B -f proxy/pom.xml -pl core test

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2 - verified
        with:
          name: surefire-core
          path: proxy/core/target/surefire-reports/
          if-no-files-found: warn

  simulator:
    name: CloudHSM simulator - compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 - resolved from the SHA, not from the tag I typed
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1 - resolved from the SHA, not from the tag I typed
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      # proxy/test is the maintained CloudHSM teaching simulator. KMS is deliberately
      # historical/unsupported in this fork and must not make the maintained path red.
      - name: Compile CloudHSM simulator (without unsupported KMS)
        run: mvn -B -f proxy/pom.xml -pl core,test package -DskipTests

  dict-v2-contract:
    name: DICT v2 transparent-proxy contract test
    runs-on: ubuntu-latest
    # Why a separate job: every other job here either skips tests (-DskipTests) or is
    # best-effort, so before this job existed NOTHING in CI executed the transparent-proxy
    # contract test. A test CI never runs is not a gate. This job runs it and nothing else,
    # so a contract regression is attributable at a glance.
    #
    # It needs no CloudHSM rpm, no HSM, no certificates and no AWS: the contract test drives
    # camel-netty-http over plain loopback HTTP. That also keeps it off the external
    # rpm download the cloudhsm job depends on, so this gate cannot go red for unrelated reasons.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 - resolved from the SHA, not from the tag I typed
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1 - resolved from the SHA, not from the tag I typed
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Run DICT v2 contract + core tests
        run: mvn -B -f proxy/pom.xml -pl core,test test

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2 - verified
        with:
          name: surefire-dict-v2-contract
          path: |
            proxy/core/target/surefire-reports/
            proxy/test/target/surefire-reports/
          if-no-files-found: warn

  cloudhsm:
    name: cloudhsm - compile (production module GATES; SDK 3 rpm fetch is best effort)
    runs-on: ubuntu-latest
    # No job-level continue-on-error any more, and that is the point.
    #
    # It used to be non-blocking wholesale, because this job needs an SDK 3 rpm fetched from
    # a public S3 bucket at build time - an external dependency we do not control, and one
    # that WILL rot, since AWS disables download links for unsupported Client SDK versions
    # and SDK 3 is end-of-life. But making the whole job advisory also meant a genuine
    # compile break in proxy/cloudhsm/proxy - the production route, the TLS factory, the
    # processors - never failed the build. That module is the point of this repository.
    #
    # So the two concerns are separated instead of traded off. Fetching and installing the
    # SDK 3 jar stays best effort at STEP level. Compiling our own source GATES, and is
    # skipped rather than failed when the prerequisite could not be fetched - with a warning
    # so a skipped gate is never mistaken for a passed one.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 - resolved from the SHA, not from the tag I typed
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1 - resolved from the SHA, not from the tag I typed
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
      - name: Install rpm tooling (required by rpm-maven-plugin)
        run: sudo apt-get update && sudo apt-get install -y rpm
      # Three steps, not two, and the split is the point.
      #
      # An earlier version folded our own build into the best-effort step: it ran
      # `-pl .,core,cloudhsm/cavium`, so the aggregator pom install, the core compile
      # AND the rpm pin verification all sat behind continue-on-error. That meant an
      # OUR-FAULT error - bumping cloudhsm.sdk3.rpm.version without its matching
      # sha256, say - failed the step, skipped the production gate, and left the job
      # green with only a warning. The commit that added it described every failure
      # there as "the rpm could not be fetched", which was not true.
      #
      # Now only the genuinely external work is advisory.
      - name: Install the aggregator pom and core - THIS GATES
        run: mvn -B -f proxy/pom.xml -pl .,core install -DskipTests
      - name: Fetch and install the SDK 3 JCE jar from S3 (external - best effort)
        id: sdk3
        continue-on-error: true
        run: mvn -B -f proxy/pom.xml -pl cloudhsm/cavium install -DskipTests
      - name: Compile proxy/cloudhsm/proxy - THIS GATES
        if: steps.sdk3.outcome == 'success'
        run: mvn -B -f proxy/pom.xml -pl cloudhsm/proxy package -DskipTests
      - name: Say plainly that the gate was skipped, not passed
        if: steps.sdk3.outcome != 'success'
        run: |
          echo "::warning::The SDK 3 JCE rpm could not be fetched from S3, so the"
          echo "::warning::proxy/cloudhsm/proxy compile gate was SKIPPED - it did not pass."
          echo "::warning::SDK 3 is end-of-life and its download links are withdrawn over time;"
          echo "::warning::see the pin in proxy/pom.xml. Note this step no longer covers our own"
          echo "::warning::build - the aggregator and core are gated separately above."

  shell:
    name: wrapper_script.sh - shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 - resolved from the SHA, not from the tag I typed
      - name: Syntax check
        run: |
          bash -n proxy/cloudhsm/proxy/src/main/docker/wrapper_script.sh
          bash -n .github/scripts/check-transport-contract.sh
      - name: ShellCheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck -S warning proxy/cloudhsm/proxy/src/main/docker/wrapper_script.sh
          shellcheck -S warning .github/scripts/check-transport-contract.sh

  transport-contract:
    name: transport contract - production route options + KMS scope guard
    runs-on: ubuntu-latest
    # The production CloudHSM route cannot be started in CI (it needs CloudHSM, an HSM login and
    # AWS), so its endpoint configuration is pinned by source assertion instead. This is the
    # companion to the dict-v2-contract job: that one characterises what the options DO, this one
    # keeps production declaring them. It also guards the CloudHSM-only scope by failing if KMS
    # re-enters the maintained workflow.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 - resolved from the SHA, not from the tag I typed
      - name: Check transport contract options and scope
        run: bash .github/scripts/check-transport-contract.sh

  doc-parity:
    name: doc parity - a document and its translation cannot disagree
    runs-on: ubuntu-latest
    # VERIFICATION.md is the authoritative audit trail and VERIFICATION.en.md is its English
    # rendering. Keeping an audit trail in two languages doubles the places a correction has to
    # land, and this repository has direct evidence that that fails: a qualifier about the CloudHSM
    # key-availability quorum was stated correctly when first measured, dropped from every later
    # summary, and ended up absent from four documents at once. The remedy is this job, not more
    # discipline.
    #
    # The negative control runs here too, not only locally. A gate whose control never ran on the
    # machine that enforces it has unverified teeth - see the alarms job, which once reported
    # "Tests: 0 total" while appearing green because its config was gitignored.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 - resolved from the SHA, not from the tag I typed
      - name: Every guarded copy must exist
        run: |
          set -euo pipefail
          for f in VERIFICATION.md VERIFICATION.en.md \
                   README-CloudHSM.md README-CloudHSM.zh-CN.md; do
            test -f "$f" || { echo "missing: $f"; exit 1; }
          done
      - name: Parity gate
        run: python3 .github/scripts/check-doc-parity.py
      - name: Negative control - the gate must fail on each drift mode, for the right reason
        run: bash .github/scripts/check-doc-parity-control.sh
      - name: The control must leave the tree untouched
        run: |
          set -euo pipefail
          if ! git diff --quiet; then
            echo "FAIL: the negative control did not restore the files it perturbed"
            git diff --stat
            exit 1
          fi
          echo "OK: tree clean after the control"

  audit-schema:
    name: audit schema - AuditLog keys vs documented Glue columns
    runs-on: ubuntu-latest
    # Turns upstream issue #16 into a build failure instead of silent data loss:
    # any field AuditLog emits must be declared as a column in both READMEs.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 - resolved from the SHA, not from the tag I typed
      - name: Compare emitted keys against documented columns
        run: |
          set -euo pipefail
          keys=$(grep -o 'put("[a-z_]*"' proxy/core/src/main/java/com/amazon/aws/pix/core/audit/AuditLog.java \
                 | sed 's/put("//; s/"//' | sort -u)
          echo "AuditLog emits:"; echo "$keys" | sed 's/^/  /'
          rc=0
          for readme in README-CloudHSM.md README-KMS.md; do
            for k in $keys; do
              if ! grep -q "name: '$k'" "$readme"; then
                echo "::error file=$readme::AuditLog emits '$k' but $readme declares no such Glue column - Firehose would drop it silently"
                rc=1
              fi
            done
          done
          [ "$rc" -eq 0 ] && echo "OK: every emitted field is declared in both READMEs"
          exit "$rc"

  alarms:
    name: audit alarms - CDK synth + assertions (GATING)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 - resolved from the SHA, not from the tag I typed
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
      # npm ci, not npm install: the lockfile is committed and CI must build what was reviewed.
      - name: install
        working-directory: alarms
        run: npm ci --no-audit --no-fund
      - name: typecheck
        working-directory: alarms
        run: npx tsc --noEmit
      # Assertions on the SYNTHESISED template. A synth that merely succeeds proves the
      # TypeScript compiles and says nothing about whether the alarms are correct - replacing
      # unverified documentation with unverified infrastructure code is not progress.
      # One of these tests reads AuditAlarmTokens.java and fails if the Java tokens and the
      # metric filters drift apart, because a filter matching a string nothing emits is an
      # alarm that can never fire, which looks like coverage and is worse than none.
      # Asserts the COUNT, not the exit code. This job already failed once in a way an exit
      # code alone would not have explained: a .gitignore pattern excluded jest.config.js, CI
      # fell back to babel-jest, could not parse TypeScript and reported "Tests: 0 total".
      # A config change that finds no tests must be a failure, not a quiet green.
      - name: assertions
        working-directory: alarms
        run: |
          set -o pipefail
          npx jest --ci 2>&1 | tee /tmp/jest.log
          PASSED=$(grep -oE 'Tests: +[0-9]+ passed, +[0-9]+ total' /tmp/jest.log | grep -oE '[0-9]+' | head -1)
          echo "assertions passed: ${PASSED:-0}"
          if [ "${PASSED:-0}" -lt 6 ]; then
            echo "ERROR: expected at least 6 CDK assertions, got ${PASSED:-0}." >&2
            echo "  A drop to 0 means the jest transform is not applying - see this job's history." >&2
            exit 1
          fi
      - name: cdk synth
        working-directory: alarms
        run: npx cdk synth --quiet
