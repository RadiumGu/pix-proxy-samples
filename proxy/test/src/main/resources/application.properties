quarkus.banner.enabled=false

quarkus.log.level=INFO

# No "main." segment on this path in camel-quarkus 2.x. Verified with javap against
# camel-quarkus-core-2.13.3.jar: RoutesDiscoveryConfig hangs off CamelConfig, whose config root
# is "camel", not off CamelMainConfig whose root is "camel.main". The old key was accepted in
# 1.x and is silently ignored now - which would have quietly re-enabled route discovery.
quarkus.camel.routes-discovery.enabled=false
camel.context.name=pix-proxy-test

# quarkus.package.TYPE, not quarkus.package.uber-jar. The old key is silently IGNORED on
# Quarkus 2.x - measured: a WARNING, exit code 0, BUILD SUCCESS, and a quarkus-app/ directory
# instead of the *-runner.jar the Dockerfile copies. Verified by rebuilding with this key and
# confirming both that the "Unrecognized configuration key" warning is gone and that a
# *-runner.jar is produced. There is a CI gate asserting the warning never comes back.
quarkus.package.type=uber-jar